; PlatformIO Project Configuration
; CEC-Dongle: REST-controlled HDMI-CEC bridge
; Hardware: SMLIGHT SLWF-08 (ESP8266 / ESP-12E)

[env:slwf08]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
extra_scripts = pre:scripts/build_web_ui.py
build_flags =
    -DVERSION=\"1.0.0\"
    -DDEFAULT_CEC_PIN=14
    -DDEFAULT_CEC_ADDRESS=0x05
    -DDEFAULT_CEC_PHYSICAL=0x4000
lib_deps =
    ArduinoJson@^7.0.0
    ESPAsyncTCP
    ESPAsyncWebServer
upload_speed = 921600

[env:slwf08-ota]
extends = env:slwf08
upload_protocol = espota
upload_port = cec-dongle.local
