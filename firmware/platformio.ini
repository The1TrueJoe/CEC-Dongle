; PlatformIO Project Configuration
; CEC-Dongle: REST-controlled HDMI-CEC bridge
; Hardware: SMLIGHT SLWF-08 (ESP8266 / ESP-12E)

[env:slwf08]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
extra_scripts =
    pre:scripts/build_web_ui.py
    post:scripts/build_combined.py
build_flags =
    -DVERSION=\"1.0.0\"
    -DDEFAULT_CEC_PIN=14
    -DDEFAULT_CEC_ADDRESS=0x04
    -DDEFAULT_CEC_PHYSICAL=0x4000
lib_deps =
    ArduinoJson@^7.0.0
    ESPAsyncTCP
    ESPAsyncWebServer
lib_ignore =
    AsyncTCP
    RPAsyncTCP
upload_speed = 921600
upload_flags =
    --before
    no_reset
    --no-stub
    --after
    no_reset

; OTA environment — device IP is auto-discovered via SDDP at upload time.
; The sddp_ota.py script broadcasts a multicast SEARCH and injects the
; discovered IP as UPLOAD_PORT before espota.py runs.
;
; If SDDP discovery fails (device offline / multicast blocked), the
; upload_port below is used as the fallback. You can also override it:
;   pio run -e slwf08-ota -t upload --upload-port 192.168.x.y
;
; IMPORTANT: upload_flags overrides the base env so only --port=8266 is
; passed to espota.py (the --before no_reset --no-stub flags are for
; esptool USB flashing only and must NOT be included here).
[env:slwf08-ota]
extends = env:slwf08
upload_protocol = espota
upload_port = 0.0.0.0  ; auto-discovered via SDDP; replace if discovery is unavailable
upload_flags =
    --port=8266
extra_scripts =
    pre:scripts/build_web_ui.py
    scripts/sddp_ota.py
    post:scripts/build_combined.py
