; PlatformIO Project Configuration
; CEC-Dongle: REST-controlled HDMI-CEC bridge
; Hardware: SMLIGHT SLWF-08 (ESP8266 / ESP-12E)

[env:slwf08]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
extra_scripts = pre:scripts/build_web_ui.py
build_flags =
    -DVERSION=\"1.0.0\"
    -DDEFAULT_CEC_PIN=14
    -DDEFAULT_CEC_ADDRESS=0x05
    -DDEFAULT_CEC_PHYSICAL=0x4000
lib_deps =
    ArduinoJson@^7.0.0
    ESPAsyncTCP
    ESPAsyncWebServer
lib_ignore =
    AsyncTCP
    RPAsyncTCP
upload_speed = 921600
upload_flags =
    --before
    no_reset
    --no-stub

; OTA environment — use the device IP directly (more reliable than mDNS .local)
; Override on the command line: pio run -e slwf08-ota --upload-port 192.168.x.y
[env:slwf08-ota]
extends = env:slwf08
upload_protocol = espota
upload_port = 192.168.1.200  ; <- replace with actual device IP (or use --upload-port)
upload_flags =
    --port=8266
