<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CEC Dongle Setup</title>
  <link rel="stylesheet" href="wizard.css">
</head>
<body>
<div class="page">

  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/>
      </svg>
    </div>
    <h1>CEC Dongle</h1>
    <p class="subtitle">WiFi Setup</p>
  </div>

  <!-- Step 1: Scan -->
  <div class="card" id="scanCard">
    <div class="card-head">Select your network</div>
    <div id="netList"><div class="msg"><div class="spinner-sm"></div>Scanning&#8230;</div></div>
    <div class="card-foot">
      <button class="btn-link" id="rescanBtn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
        Rescan
      </button>
    </div>
  </div>

  <!-- Step 2: Credentials -->
  <div class="card hidden" id="credCard">
    <div class="card-head">
      <button class="back-btn" id="backBtn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </button>
      <span id="credHeading">Password</span>
    </div>
    <div class="field-group">
      <div id="openBadge" class="open-badge hidden">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
        Open network — no password needed
      </div>
      <div id="passWrap">
        <label class="field-label">Password</label>
        <div class="pass-wrap">
          <input type="password" id="wifiPass" placeholder="WiFi password" autocomplete="current-password">
          <button class="show-btn" id="showPass" type="button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <label class="field-label mt">Hostname <span class="optional">(optional)</span></label>
      <input type="text" id="hostname" placeholder="cec-dongle" autocomplete="off">
      <span class="hint">Access device at http://cec-dongle.local after setup</span>
      <p class="msg-error hidden" id="credError"></p>
    </div>
    <div class="actions">
      <button class="btn-primary" id="connectBtn">Connect</button>
    </div>
  </div>

  <!-- Step 3: Connecting -->
  <div class="card hidden" id="connectingCard">
    <div class="center-block">
      <div class="spinner"></div>
      <p class="msg-big" id="connectMsg">Connecting&#8230;</p>
    </div>
  </div>

  <!-- Step 4: Done -->
  <div class="card hidden" id="doneCard">
    <div class="center-block">
      <div class="done-icon" id="doneIcon"></div>
      <p class="msg-big" id="doneTitle">Setup complete!</p>
      <p class="msg-sub" id="doneMsg"></p>
    </div>
  </div>

</div>
<script src="wizard.js"></script>
</body>
</html>
